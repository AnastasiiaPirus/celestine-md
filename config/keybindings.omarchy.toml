# CelestineMD — Omarchy-friendly profile (Ctrl mirrors Super intents; never binds Super)
profile = "omarchy"

[bindings]
quick_open = "Mod+O"
command_palette = "Mod+P"
graph = "Mod+G"
close_tab = "Mod+W"
new_note = "Mod+N"
save = "Mod+S"
toggle_preview = "Mod+E"
find = "Mod+F"
vault_search = "Mod+Shift+F"
settings = "Mod+,"
quit = "Mod+Q"
shortcuts = "?"
shortcuts_editor = "Mod+/"
theme_picker = "Mod+T"
open_vault = "Mod+Shift+O"
recent_vaults = "Mod+R"
close_vault = "Mod+Shift+W"
font_bigger = "Mod+="
font_smaller = "Mod+-"
font_reset = "Mod+0"
next_tab = "Ctrl+Tab"
prev_tab = "Ctrl+Shift+Tab"
former_tab = "Ctrl+Alt+Tab"
focus_files = "Ctrl+Shift+E"
focus_outline = "Ctrl+Shift+O"
next_pane = "Ctrl+Alt+Right"
prev_pane = "Ctrl+Alt+Left"
tab_1 = "Ctrl+1"
tab_2 = "Ctrl+2"
tab_3 = "Ctrl+3"
tab_4 = "Ctrl+4"
tab_5 = "Ctrl+5"
tab_6 = "Ctrl+6"
tab_7 = "Ctrl+7"
tab_8 = "Ctrl+8"
tab_9 = "Ctrl+9"
escape = "Escape"

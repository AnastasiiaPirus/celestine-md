# CelestineMD — Obsidian-like profile (Mod = Ctrl on Win/Linux, Cmd on macOS)
profile = "obsidian"

[bindings]
quick_open = "Mod+O"
command_palette = "Mod+P"
graph = "Mod+G"
close_tab = "Mod+W"
new_note = "Mod+N"
save = "Mod+S"
toggle_preview = "Mod+E"
find = "Mod+F"
vault_search = "Mod+Shift+F"
settings = "Mod+,"
quit = "Mod+Q"
shortcuts = "?"
shortcuts_editor = "Mod+/"
theme_picker = "Mod+T"
open_vault = "Mod+Shift+O"
recent_vaults = "Mod+R"
close_vault = "Mod+Shift+W"
font_bigger = "Mod+="
font_smaller = "Mod+-"
font_reset = "Mod+0"
next_tab = "Ctrl+Tab"
prev_tab = "Ctrl+Shift+Tab"
escape = "Escape"
